<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Casio Valdivia</title>

<style>

/* =========================================================
   PANTALLA COMPLETA
   Diseñado para iPad antiguo en horizontal
   ========================================================= */

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080b06;
    font-family: "Courier New", Courier, monospace;
}

body {
    color: #b8d870;
    -webkit-user-select: none;
}


/* =========================================================
   MARCO
   ========================================================= */

#watch {
    position: absolute;
    left: 1%;
    top: 1%;
    width: 98%;
    height: 98%;

    box-sizing: border-box;

    border: 2px solid #4a6228;

    background: #11180c;

    overflow: hidden;
}


/* =========================================================
   CABECERA
   6% de la pantalla
   ========================================================= */

#header {
    position: relative;

    height: 6%;

    box-sizing: border-box;

    border-bottom: 1px solid #4a6228;
}


#brand {
    position: absolute;

    left: 2%;
    top: 24%;

    font-size: 1.45vw;
    font-weight: bold;

    letter-spacing: 0.20em;
}


#themes {
    position: absolute;

    right: 1.5%;
    top: 13%;
}


.themeButton {
    display: inline-block;

    margin-left: 5px;

    padding: 4px 9px;

    border: 1px solid #4a6228;

    font-size: 1.20vw;

    font-weight: bold;

    cursor: pointer;
}


/* =========================================================
   RELOJ
   43% de la pantalla
   ========================================================= */

#clockArea {
    position: relative;

    height: 43%;

    box-sizing: border-box;

    border-bottom: 1px solid #4a6228;
}


#clock {
    position: absolute;

    left: 0;
    top: 1%;

    width: 100%;

    text-align: center;

    font-size: 17.5vw;

    line-height: 0.90;

    font-weight: bold;

    letter-spacing: -0.10em;

    text-shadow:
        0 0 14px #93bd39;
}


#date {
    position: absolute;

    left: 0;
    bottom: 3%;

    width: 100%;

    text-align: center;

    font-size: 3.4vw;

    font-weight: bold;

    letter-spacing: 0.13em;
}


/* =========================================================
   ZONA DE INFORMACION
   40% de la pantalla
   ========================================================= */

#information {
    position: relative;

    height: 40%;

    box-sizing: border-box;

    border-bottom: 1px solid #4a6228;
}


/* =========================================================
   CLIMA - IZQUIERDA
   ========================================================= */

#weather {
    position: absolute;

    left: 0;
    top: 0;

    width: 50%;
    height: 100%;

    box-sizing: border-box;

    padding: 1.2% 2%;

    border-right: 1px solid #4a6228;
}


.sectionTitle {
    font-size: 1.55vw;

    font-weight: bold;

    letter-spacing: 0.15em;
}


/* Temperatura */

#temperature {
    position: absolute;

    left: 4%;
    top: 23%;

    font-size: 9.5vw;

    line-height: 0.80;

    font-weight: bold;

    text-shadow:
        0 0 12px #93bd39;
}


#degree {
    font-size: 2.7vw;

    vertical-align: top;
}


/* Estado del clima */

#condition {
    position: absolute;

    left: 4%;
    bottom: 7%;

    width: 49%;

    font-size: 1.65vw;

    line-height: 1.1;

    font-weight: bold;

    letter-spacing: 0.05em;
}


/* Sensacion / humedad / viento */

#weatherData {
    position: absolute;

    left: 53%;
    top: 23%;

    width: 45%;

    font-size: 1.65vw;

    line-height: 1.75;

    letter-spacing: 0.01em;
}


.value {
    font-weight: bold;
    font-size: 1.15em;
}


/* =========================================================
   PRONOSTICO - DERECHA
   ========================================================= */

#today {
    position: absolute;

    left: 50%;
    top: 0;

    width: 50%;
    height: 100%;

    box-sizing: border-box;

    padding: 1.2% 2%;
}


#todayData {
    position: absolute;

    left: 5%;
    top: 23%;

    width: 91%;

    font-size: 1.75vw;

    line-height: 1.75;

    letter-spacing: 0.02em;
}


/* =========================================================
   MENSAJE DEL DIA
   ========================================================= */

#messageArea {
    position: relative;

    height: 11%;
}


#message {
    position: absolute;

    left: 2%;
    top: 23%;

    width: 96%;

    text-align: center;

    font-size: 1.75vw;

    font-weight: bold;

    letter-spacing: 0.055em;
}


#update {
    position: absolute;

    right: 1.5%;
    bottom: 5%;

    font-size: 0.85vw;

    letter-spacing: 0.08em;

    opacity: 0.65;
}

</style>

</head>


<body>

<div id="watch">


    <!-- ===================================================
         CABECERA
         =================================================== -->

    <div id="header">

        <div id="brand">
            ● CASIO &nbsp; WORLD TIME &nbsp; VALDIVIA
        </div>

        <div id="themes">

            <span
                class="themeButton"
                onclick="setTheme('green')"
            >
                GRN
            </span>

            <span
                class="themeButton"
                onclick="setTheme('blue')"
            >
                BLU
            </span>

            <span
                class="themeButton"
                onclick="setTheme('white')"
            >
                B&amp;W
            </span>

        </div>

    </div>



    <!-- ===================================================
         RELOJ
         =================================================== -->

    <div id="clockArea">

        <div id="clock">
            --:--
        </div>

        <div id="date">
            CARGANDO
        </div>

    </div>



    <!-- ===================================================
         INFORMACION
         =================================================== -->

    <div id="information">


        <!-- ===============================================
             CLIMA
             =============================================== -->

        <div id="weather">

            <div class="sectionTitle">
                ▲ CLIMA / VALDIVIA
            </div>


            <div id="temperature">

                --<span id="degree">°C</span>

            </div>


            <div id="condition">
                CARGANDO...
            </div>


            <div id="weatherData">

                SENS.
                <span
                    class="value"
                    id="feels"
                >
                    --
                </span>
                °C

                <br>

                HUM.
                <span
                    class="value"
                    id="humidity"
                >
                    --
                </span>
                %

                <br>

                VIENTO
                <span
                    class="value"
                    id="wind"
                >
                    --
                </span>
                KM/H

            </div>

        </div>



        <!-- ===============================================
             PRONOSTICO
             =============================================== -->

        <div id="today">

            <div class="sectionTitle">
                ■ PRONÓSTICO / HOY
            </div>


            <div id="todayData">

                MÁX.
                <span
                    class="value"
                    id="maxTemp"
                >
                    --
                </span>
                °C

                &nbsp;&nbsp;

                MÍN.
                <span
                    class="value"
                    id="minTemp"
                >
                    --
                </span>
                °C

                <br>


                LLUVIA
                <span
                    class="value"
                    id="rain"
                >
                    --
                </span>
                %

                <br>


                ☀
                <span
                    class="value"
                    id="sunrise"
                >
                    --:--
                </span>

                &nbsp;&nbsp;&nbsp;

                ☾
                <span
                    class="value"
                    id="sunset"
                >
                    --:--
                </span>

            </div>

        </div>

    </div>



    <!-- ===================================================
         MENSAJE DEL DIA
         =================================================== -->

    <div id="messageArea">

        <div id="message">
            BIENVENIDO
        </div>

        <div id="update">
            CLIMA: ESPERANDO
        </div>

    </div>


</div>



<script>

/*
 ============================================================
 CASIO DASHBOARD
 VALDIVIA - CHILE

 Version optimizada para:
 iPad antiguo / Safari iOS 9

 El clima se obtiene exclusivamente desde:
 /api/weather
 ============================================================
*/


/* =========================================================
   FECHA
   ========================================================= */

var DIAS = [
    "DOM",
    "LUN",
    "MAR",
    "MIÉ",
    "JUE",
    "VIE",
    "SÁB"
];


var MESES = [
    "ENE",
    "FEB",
    "MAR",
    "ABR",
    "MAY",
    "JUN",
    "JUL",
    "AGO",
    "SEP",
    "OCT",
    "NOV",
    "DIC"
];


function pad(numero) {

    if (numero < 10) {
        return "0" + numero;
    }

    return String(numero);
}



/* =========================================================
   RELOJ
   ========================================================= */

function actualizarReloj() {

    var ahora =
        new Date();


    var hora =
        pad(ahora.getHours()) +
        ":" +
        pad(ahora.getMinutes());


    ponerTexto(
        "clock",
        hora
    );


    var fecha =
        DIAS[ahora.getDay()] +
        " " +
        pad(ahora.getDate()) +
        "-" +
        MESES[ahora.getMonth()] +
        "-" +
        ahora.getFullYear();


    ponerTexto(
        "date",
        fecha
    );
}



/* =========================================================
   MENSAJES DIARIOS
   ========================================================= */

var MENSAJES = [

    "DOMINGO · DISFRUTA EL DÍA Y RECARGA ENERGÍAS.",

    "LUNES · UNA BUENA SEMANA COMIENZA CON UN BUEN PRIMER PASO.",

    "MARTES · AVANZA CON CALMA, PERO SIGUE AVANZANDO.",

    "MIÉRCOLES · MITAD DE SEMANA. MANTÉN EL RUMBO.",

    "JUEVES · CADA TAREA TERMINADA CUENTA.",

    "VIERNES · TERMINA BIEN LA SEMANA Y DISFRUTA LO LOGRADO.",

    "SÁBADO · TIEMPO PARA DESCANSAR Y DISFRUTAR."

];


function actualizarMensaje() {

    var ahora =
        new Date();


    ponerTexto(
        "message",
        MENSAJES[ahora.getDay()]
    );
}



/* =========================================================
   DESCRIPCION DEL CLIMA
   ========================================================= */

function descripcionClima(codigo) {

    codigo =
        Number(codigo);


    if (codigo === 0) {
        return "DESPEJADO";
    }


    if (codigo === 1) {
        return "MAYORMENTE DESPEJADO";
    }


    if (codigo === 2) {
        return "PARCIALMENTE NUBLADO";
    }


    if (codigo === 3) {
        return "NUBLADO";
    }


    if (
        codigo === 45 ||
        codigo === 48
    ) {
        return "NIEBLA";
    }


    if (
        codigo >= 51 &&
        codigo <= 57
    ) {
        return "LLOVIZNA";
    }


    if (
        codigo >= 61 &&
        codigo <= 67
    ) {
        return "LLUVIA";
    }


    if (
        codigo >= 71 &&
        codigo <= 77
    ) {
        return "NIEVE";
    }


    if (
        codigo >= 80 &&
        codigo <= 82
    ) {
        return "CHUBASCOS";
    }


    if (
        codigo === 85 ||
        codigo === 86
    ) {
        return "CHUBASCOS DE NIEVE";
    }


    if (codigo >= 95) {
        return "TORMENTA";
    }


    return "TIEMPO VARIABLE";
}



/* =========================================================
   HORA DE AMANECER / ATARDECER
   ========================================================= */

function horaSolar(valor) {

    if (!valor) {
        return "--:--";
    }


    var posicion =
        valor.indexOf("T");


    if (posicion < 0) {
        return "--:--";
    }


    return valor.substring(
        posicion + 1,
        posicion + 6
    );
}



/* =========================================================
   CLIMA
   ========================================================= */

function cargarClima() {

    var xhr =
        new XMLHttpRequest();


    xhr.open(
        "GET",
        "/api/weather?t=" +
        new Date().getTime(),
        true
    );


    xhr.onreadystatechange =
        function() {


            if (xhr.readyState !== 4) {
                return;
            }


            if (xhr.status !== 200) {

                mostrarErrorClima(
                    "SIN CONEXIÓN"
                );

                return;
            }


            try {


                var datos =
                    JSON.parse(
                        xhr.responseText
                    );


                if (!datos.ok) {

                    mostrarErrorClima(
                        "SIN DATOS"
                    );

                    return;
                }


                /* TEMPERATURA */

                ponerTexto(
                    "temperature",
                    redondear(
                        datos.temperature
                    ) +
                    '<span id="degree">°C</span>'
                );


                /* SENSACION */

                ponerTexto(
                    "feels",
                    redondear(
                        datos.feels
                    )
                );


                /* HUMEDAD */

                ponerTexto(
                    "humidity",
                    redondear(
                        datos.humidity
                    )
                );


                /* VIENTO */

                ponerTexto(
                    "wind",
                    redondear(
                        datos.wind
                    )
                );


                /* ESTADO */

                ponerTexto(
                    "condition",
                    descripcionClima(
                        datos.weatherCode
                    )
                );


                /* MAXIMA */

                ponerTexto(
                    "maxTemp",
                    redondear(
                        datos.max
                    )
                );


                /* MINIMA */

                ponerTexto(
                    "minTemp",
                    redondear(
                        datos.min
                    )
                );


                /* LLUVIA */

                ponerTexto(
                    "rain",
                    redondear(
                        datos.rain
                    )
                );


                /* AMANECER */

                ponerTexto(
                    "sunrise",
                    horaSolar(
                        datos.sunrise
                    )
                );


                /* ATARDECER */

                ponerTexto(
                    "sunset",
                    horaSolar(
                        datos.sunset
                    )
                );


                /* HORA DE ACTUALIZACION */

                var ahora =
                    new Date();


                ponerTexto(
                    "update",
                    "ACTUALIZADO " +
                    pad(
                        ahora.getHours()
                    ) +
                    ":" +
                    pad(
                        ahora.getMinutes()
                    )
                );


            }
            catch (error) {


                mostrarErrorClima(
                    "ERROR DE DATOS"
                );

            }

        };


    xhr.onerror =
        function() {


            mostrarErrorClima(
                "SIN CONEXIÓN"
            );

        };


    xhr.send(null);
}



/* =========================================================
   FUNCIONES AUXILIARES
   ========================================================= */

function redondear(valor) {

    if (
        valor === null ||
        typeof valor === "undefined"
    ) {
        return "--";
    }


    var numero =
        Number(valor);


    if (isNaN(numero)) {
        return "--";
    }


    return Math.round(numero);
}



function ponerTexto(id, contenido) {

    var elemento =
        document.getElementById(id);


    if (elemento) {

        elemento.innerHTML =
            contenido;
    }
}



function mostrarErrorClima(texto) {

    ponerTexto(
        "condition",
        texto
    );


    ponerTexto(
        "update",
        "CLIMA NO DISPONIBLE"
    );
}



/* =========================================================
   TEMAS
   ========================================================= */

function aplicarBordes(color) {

    var watch =
        document.getElementById("watch");

    var header =
        document.getElementById("header");

    var clockArea =
        document.getElementById("clockArea");

    var information =
        document.getElementById("information");

    var weather =
        document.getElementById("weather");


    if (watch) {
        watch.style.borderColor = color;
    }


    if (header) {
        header.style.borderBottomColor = color;
    }


    if (clockArea) {
        clockArea.style.borderBottomColor = color;
    }


    if (information) {
        information.style.borderBottomColor = color;
    }


    if (weather) {
        weather.style.borderRightColor = color;
    }


    var botones =
        document.getElementsByClassName(
            "themeButton"
        );


    var i;


    for (
        i = 0;
        i < botones.length;
        i++
    ) {

        botones[i].style.borderColor =
            color;
    }
}



function setTheme(tema) {

    var watch =
        document.getElementById("watch");

    var clock =
        document.getElementById("clock");

    var temperature =
        document.getElementById("temperature");


    if (!watch) {
        return;
    }


    /* VERDE */

    if (tema === "green") {


        document.body.style.background =
            "#080b06";


        watch.style.background =
            "#11180c";


        watch.style.color =
            "#b8d870";


        aplicarBordes(
            "#4a6228"
        );


        if (clock) {

            clock.style.textShadow =
                "0 0 14px #93bd39";
        }


        if (temperature) {

            temperature.style.textShadow =
                "0 0 12px #93bd39";
        }
    }


    /* AZUL */

    if (tema === "blue") {


        document.body.style.background =
            "#03080c";


        watch.style.background =
            "#07131c";


        watch.style.color =
            "#70b8d8";


        aplicarBordes(
            "#315d70"
        );


        if (clock) {

            clock.style.textShadow =
                "0 0 14px #429bc4";
        }


        if (temperature) {

            temperature.style.textShadow =
                "0 0 12px #429bc4";
        }
    }


    /* BLANCO Y NEGRO */

    if (tema === "white") {


        document.body.style.background =
            "#d5d5d0";


        watch.style.background =
            "#eeeeea";


        watch.style.color =
            "#111111";


        aplicarBordes(
            "#333333"
        );


        if (clock) {

            clock.style.textShadow =
                "none";
        }


        if (temperature) {

            temperature.style.textShadow =
                "none";
        }
    }


    try {

        localStorage.setItem(
            "casio-theme",
            tema
        );

    }
    catch (e) {

    }
}



/* =========================================================
   RECUPERAR TEMA
   ========================================================= */

function cargarTema() {

    var tema =
        "green";


    try {

        var guardado =
            localStorage.getItem(
                "casio-theme"
            );


        if (guardado) {
            tema = guardado;
        }

    }
    catch (e) {

    }


    setTheme(
        tema
    );
}



/* =========================================================
   INICIO
   ========================================================= */

function iniciar() {


    /*
     Todo lo local aparece inmediatamente.
    */

    actualizarReloj();

    actualizarMensaje();

    cargarTema();


    /*
     Después solicitamos el clima.
    */

    cargarClima();


    /*
     Hora
    */

    setInterval(
        actualizarReloj,
        1000
    );


    /*
     Mensaje diario
    */

    setInterval(
        actualizarMensaje,
        60000
    );


    /*
     Clima cada 10 minutos
    */

    setInterval(
        cargarClima,
        600000
    );

}


iniciar();


</script>

</body>
</html>
