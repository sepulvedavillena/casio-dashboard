<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Casio Valdivia</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a08;
}

body {
    font-family: "Courier New", monospace;
    color: #b8d870;
}

#watch {
    position: absolute;
    left: 2%;
    top: 2%;
    width: 96%;
    height: 96%;
    box-sizing: border-box;
    border: 2px solid #4a6228;
    background: #141f0c;
}

/* CABECERA */

#header {
    height: 8%;
    box-sizing: border-box;
    border-bottom: 1px solid #4a6228;
    position: relative;
}

#brand {
    position: absolute;
    left: 2%;
    top: 30%;
    font-size: 1.2vw;
    letter-spacing: 0.35em;
}

#mode {
    position: absolute;
    right: 2%;
    top: 22%;
}

.modeButton {
    display: inline-block;
    border: 1px solid #4a6228;
    padding: 3px 7px;
    margin-left: 4px;
    font-size: 1vw;
    cursor: pointer;
}

/* RELOJ */

#clockArea {
    height: 57%;
    position: relative;
    box-sizing: border-box;
    border-bottom: 1px solid #4a6228;
}

#clock {
    position: absolute;
    width: 100%;
    top: 8%;
    text-align: center;
    font-family: "Courier New", monospace;
    font-size: 17vw;
    line-height: 0.9;
    font-weight: bold;
    letter-spacing: -0.08em;
    text-shadow: 0 0 14px #9acb38;
}

#date {
    position: absolute;
    width: 100%;
    bottom: 8%;
    text-align: center;
    font-size: 2.8vw;
    font-weight: bold;
    letter-spacing: 0.22em;
}

/* CLIMA */

#weatherArea {
    height: 35%;
    position: relative;
    box-sizing: border-box;
    padding: 2% 3%;
}

#weatherTitle {
    font-size: 1.15vw;
    letter-spacing: 0.28em;
    margin-bottom: 1%;
}

#weatherContent {
    position: relative;
    width: 100%;
    height: 80%;
}

#temperature {
    position: absolute;
    left: 0;
    top: 0;
    font-size: 8vw;
    font-weight: bold;
    line-height: 1;
    text-shadow: 0 0 10px #9acb38;
}

#degree {
    font-size: 2.5vw;
}

#weatherDetails {
    position: absolute;
    left: 27%;
    top: 8%;
    font-size: 1.5vw;
    line-height: 1.8;
    letter-spacing: 0.08em;
}

#weatherStatus {
    position: absolute;
    right: 2%;
    top: 8%;
    width: 35%;
    text-align: right;
    font-size: 2vw;
    letter-spacing: 0.12em;
}

/* TEMAS */

.green {
    background: #0a0a08 !important;
    color: #b8d870 !important;
}

.blue {
    background: #07131c !important;
    color: #70b8d8 !important;
}

.white {
    background: #eeeeea !important;
    color: #111111 !important;
}

</style>
</head>

<body>

<div id="watch">

    <div id="header">
        <div id="brand">
            ● CASIO &nbsp;&nbsp; WORLD TIME
        </div>

        <div id="mode">
            <span class="modeButton" onclick="setTheme('green')">GRN</span>
            <span class="modeButton" onclick="setTheme('blue')">BLU</span>
            <span class="modeButton" onclick="setTheme('white')">B&amp;W</span>
        </div>
    </div>

    <div id="clockArea">

        <div id="clock">
            --:--
        </div>

        <div id="date">
            CARGANDO
        </div>

    </div>

    <div id="weatherArea">

        <div id="weatherTitle">
            ▲ WEATHER / VALDIVIA
        </div>

        <div id="weatherContent">

            <div id="temperature">
                --<span id="degree">°C</span>
            </div>

            <div id="weatherDetails">
                SENSACIÓN: <span id="feels">--</span>°C<br>
                HUMEDAD: <span id="humidity">--</span>%<br>
                VIENTO: <span id="wind">--</span> KM/H
            </div>

            <div id="weatherStatus">
                CARGANDO...
            </div>

        </div>

    </div>

</div>

<script>

/*
   CASIO DASHBOARD
   VALDIVIA, CHILE
   Compatible con navegadores antiguos
*/

/* Coordenadas de Valdivia */

var LAT = -39.8142;
var LON = -73.2459;


/* Nombres en español */

var DIAS = [
    "DOM",
    "LUN",
    "MAR",
    "MIÉ",
    "JUE",
    "VIE",
    "SÁB"
];

var MESES = [
    "ENE",
    "FEB",
    "MAR",
    "ABR",
    "MAY",
    "JUN",
    "JUL",
    "AGO",
    "SEP",
    "OCT",
    "NOV",
    "DIC"
];


/* Añadir cero */

function pad(numero) {

    if (numero < 10) {
        return "0" + numero;
    }

    return numero;
}


/* RELOJ */

function actualizarReloj() {

    var ahora = new Date();

    var hora =
        pad(ahora.getHours()) +
        ":" +
        pad(ahora.getMinutes());

    document.getElementById("clock").innerHTML = hora;

    var fecha =
        DIAS[ahora.getDay()] +
        " " +
        pad(ahora.getDate()) +
        "-" +
        MESES[ahora.getMonth()] +
        "-" +
        ahora.getFullYear();

    document.getElementById("date").innerHTML = fecha;
}


/* DESCRIPCIÓN DEL CLIMA */

function descripcionClima(codigo) {

    if (codigo === 0) {
        return "DESPEJADO";
    }

    if (codigo === 1) {
        return "MAYORMENTE DESPEJADO";
    }

    if (codigo === 2) {
        return "PARCIALMENTE NUBLADO";
    }

    if (codigo === 3) {
        return "NUBLADO";
    }

    if (codigo === 45 || codigo === 48) {
        return "NIEBLA";
    }

    if (codigo >= 51 && codigo <= 57) {
        return "LLOVIZNA";
    }

    if (codigo >= 61 && codigo <= 67) {
        return "LLUVIA";
    }

    if (codigo >= 71 && codigo <= 77) {
        return "NIEVE";
    }

    if (codigo >= 80 && codigo <= 82) {
        return "CHUBASCOS";
    }

    if (codigo >= 95) {
        return "TORMENTA";
    }

    return "CONDICIÓN VARIABLE";
}


/* CLIMA */

function cargarClima() {

    var xhr = new XMLHttpRequest();

    var url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + LAT +
        "&longitude=" + LON +
        "&current_weather=true" +
        "&hourly=relativehumidity_2m,apparent_temperature" +
        "&timezone=America%2FSantiago";

    xhr.open("GET", url, true);

    xhr.onreadystatechange = function() {

        if (xhr.readyState !== 4) {
            return;
        }

        if (xhr.status !== 200) {

            document.getElementById("weatherStatus").innerHTML =
                "SIN CONEXIÓN";

            return;
        }

        try {

            var datos = JSON.parse(xhr.responseText);

            var actual = datos.current_weather;

            if (!actual) {
                document.getElementById("weatherStatus").innerHTML =
                    "SIN DATOS";
                return;
            }

            var temperatura =
                Math.round(actual.temperature);

            var viento =
                Math.round(actual.windspeed);

            var codigo =
                actual.weathercode;

            document.getElementById("temperature").innerHTML =
                temperatura +
                '<span id="degree">°C</span>';

            document.getElementById("wind").innerHTML =
                viento;

            document.getElementById("weatherStatus").innerHTML =
                descripcionClima(codigo);


            /*
              Buscar hora correspondiente para humedad
              y sensación térmica
            */

            var indice = -1;

            if (datos.hourly && datos.hourly.time) {

                var horaActual =
                    actual.time.substring(0, 13);

                var i;

                for (i = 0; i < datos.hourly.time.length; i++) {

                    if (
                        datos.hourly.time[i].substring(0, 13)
                        === horaActual
                    ) {

                        indice = i;
                        break;
                    }
                }
            }


            if (indice >= 0) {

                var humedad =
                    datos.hourly.relativehumidity_2m[indice];

                var sensacion =
                    datos.hourly.apparent_temperature[indice];

                document.getElementById("humidity").innerHTML =
                    Math.round(humedad);

                document.getElementById("feels").innerHTML =
                    Math.round(sensacion);
            }


        } catch (error) {

            document.getElementById("weatherStatus").innerHTML =
                "ERROR DATOS";
        }
    };

    xhr.send();
}


/* TEMAS */

function setTheme(tema) {

    var watch =
        document.getElementById("watch");

    if (tema === "green") {

        watch.style.background = "#141f0c";
        watch.style.color = "#b8d870";
        watch.style.borderColor = "#4a6228";

        document.body.style.background = "#0a0a08";
    }

    if (tema === "blue") {

        watch.style.background = "#07131c";
        watch.style.color = "#70b8d8";
        watch.style.borderColor = "#315d70";

        document.body.style.background = "#030a0e";
    }

    if (tema === "white") {

        watch.style.background = "#eeeeea";
        watch.style.color = "#111111";
        watch.style.borderColor = "#333333";

        document.body.style.background = "#ddddda";
    }
}


/* INICIO */

actualizarReloj();

setInterval(
    actualizarReloj,
    1000
);

cargarClima();

setInterval(
    cargarClima,
    600000
);

</script>

</body>
</html>
